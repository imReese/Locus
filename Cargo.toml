[workspace]
resolver = "3"
members = [
    "crates/locus-core",
    "crates/locus-engine",
    "crates/locus-planner",
    "crates/locus-semantics",
    "crates/locus-state",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/imReese/Locus"

[workspace.dependencies]
async-trait = "0.1.89"
futures = "0.3.31"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
