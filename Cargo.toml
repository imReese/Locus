[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/model-io",
    "crates/parser",
    "crates/engine",
    "crates/store",
    "crates/planner",
    "crates/runtime",
    "crates/openai",
    "crates/engine-openai",
    "crates/store/nexuskv",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/imReese/Locus"

[workspace.dependencies]
async-trait = "0.1.89"
async-stream = "0.3.6"
axum = "0.8.6"
bytes = "1.10.1"
eventsource-stream = "0.2.3"
futures = "0.3.31"
http-body-util = "0.1.3"
minijinja = "2.12.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokenizers = { version = "0.22.1", default-features = false, features = ["onig"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["catch-panic", "request-id", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
